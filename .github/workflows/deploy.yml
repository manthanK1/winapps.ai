# Builds the static site and publishes it to GitHub Pages on every push to
# main, then pings IndexNow so Bing and the other IndexNow engines recrawl.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Where the site is served. Until www.winapps.co.in points at GitHub Pages it
# is previewed at https://manthank1.github.io/winapps.ai/. To go live on the
# domain, set repository variables SITE_URL=https://www.winapps.co.in and
# BASE_PATH=/ (Settings → Secrets and variables → Actions → Variables).
env:
  SITE_URL: ${{ vars.SITE_URL || 'https://manthank1.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/winapps.ai/' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap's <lastmod> comes from each page's last commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional repository variables, as above.
          PUBLIC_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
          PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
      # Headings, images, ids, JSON-LD, meta limits, links, routes, sitemap.
      - run: npm run qa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Only for the real domain: the github.io preview is not pinged to search engines.
  indexnow:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SITE_URL != '' && !contains(vars.SITE_URL, 'github.io')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Give the Pages CDN a moment so the new sitemap and pages are live.
      - run: sleep 60
      - run: node scripts/indexnow.mjs
