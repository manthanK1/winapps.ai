# Open roles: one page each at /careers/<id>/, listed on /careers/. The wording
# comes from Winapps' job descriptions. To close a role, delete its entry; to
# open one, copy an entry and give it a new id.
#
# - id: the page URL. Unique and lower-case.
# - summary: one line for the role's card on /careers/.
# - seoDescription: search result text, 170 characters at most.
# - responsibilities: lists, each with an optional heading.
# - sections: the role's other lists (skills, qualifications), titled as HR wrote them.
# - apply: what to send, shown above the application form.

- id: business-development-executive
  title: Business Development Executive (BDE)
  order: 1
  department: Business Development / Sales
  location: Karnal, Haryana
  jobType: Full-time, work from office
  experience: Freshers or 1–3 years
  summary: Expand our client base, generate new business opportunities and build long-term client relationships.
  seoDescription: Business Development Executive at Winapps in Karnal, Haryana. Generate leads, win IT services projects and build long-term client relationships.
  about: Winapps Software Solutions Pvt. Ltd. is an IT company focused on delivering software development and technology solutions to clients. We are looking for a motivated Business Development Executive to help expand our client base, generate new business opportunities, and build long-term client relationships.
  responsibilities:
    - items:
        - Identify and generate new business opportunities for IT services and software development projects.
        - Generate leads through LinkedIn, Upwork, email marketing, cold calling, and other online platforms.
        - Connect with domestic and international clients to understand their business requirements.
        - Promote IT services, including web development, mobile app development, custom software, and AI-based solutions.
        - Prepare proposals, quotations, presentations, and business pitches.
        - Follow up with potential clients and convert leads into successful projects.
        - Build and maintain strong, long-term client relationships.
        - Coordinate with technical teams to understand project requirements and prepare suitable proposals.
        - Maintain a database of leads, client communications, and sales activities.
        - Achieve monthly lead generation, meeting, and revenue targets.
  sections:
    - title: Required skills & qualifications
      items:
        - Bachelor's degree in Business Administration, Marketing, IT, or a related field preferred.
        - Excellent communication, negotiation, and presentation skills.
        - Basic understanding of IT services and software development.
        - Experience with lead generation, client acquisition, and sales.
        - Knowledge of LinkedIn Sales Navigator, Upwork, CRM tools, and email marketing is an advantage.
        - Ability to work independently and achieve business targets.
        - Freshers with strong communication skills and a willingness to learn may also apply.
    - title: Preferred experience
      items:
        - Freshers or candidates with 1–3 years of experience in business development or IT sales.
        - Experience in selling software development services to international clients will be an advantage.
  offer:
    - Competitive salary with performance-based incentives.
    - Career growth and learning opportunities.
    - Supportive and professional work environment.
    - Exposure to international clients and IT projects.
    - Opportunity to develop sales, negotiation, and client management skills.
  apply: Share your updated CV with the Winapps HR team.

