# Long-form training programmes, shown first on /training/ and in the header
# menu, grouped by audience. Names and durations are Winapps' own.
#
# - id: the page URL, /training/<id>/. Unique, lower-case, and different from
#   every course id in training.yaml (the build checks).
# - audience: professionals | students
# - domain: software | data-analytics | ai | data-science (see TRAINING_DOMAINS
#   in src/data/copy.ts); leave it out if none fits.
# - logos: keys from src/lib/tech-logos.ts (the official logos).
# - internship: true when the programme includes an internship.
#
# TODO(Winapps): the summaries and topics only restate the programme titles
# and the domain tools Winapps listed. Replace them with the real curriculum,
# and confirm the logos (DSA: which language? Forward Deployed Engineering:
# which stack?). Fees, batch dates and mode are not listed: people enquire.

# ---- For working professionals --------------------------------------------
- id: data-analytics-genai
  name: Data Analytics with GenAI
  audience: professionals
  order: 1
  months: 6
  domain: data-analytics
  logos: [mysql, excel, powerbi, python, openai]
  summary: Data analytics with SQL, Excel, Power BI, Python and data visualization, combined with generative AI.
  topics:
    - SQL
    - Excel
    - Power BI
    - Python for data analysis
    - Data visualization
    - Generative AI for analytics

